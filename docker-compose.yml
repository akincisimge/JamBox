services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jambox
      POSTGRES_USER: jambox
      POSTGRES_PASSWORD: jambox
    ports:
      - "5432:5432"
    volumes:
      - jambox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jambox -d jambox"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://jambox:jambox@db:5432/jambox
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

volumes:
  jambox_postgres_data:
