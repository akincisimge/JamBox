name: Apply Tek Kart integration

on:
  pull_request:
    types: [opened]
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/tek-kart-game'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tek-kart-game
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Adjust reset anchor compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("automation/apply_tek_kart_app.py")
          content = path.read_text()
          old = '    2,\n)\n\nhandlers ='
          new = '    1,\n)\n\nhandlers ='
          if content.count(old) != 1:
              raise RuntimeError("Expected reset-count anchor was not found exactly once.")
          path.write_text(content.replace(old, new, 1))
          PY

      - name: Apply guarded integration
        run: python automation/apply_tek_kart_app.py

      - name: Apply indented exit reset
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/JamBoxApp.tsx")
          content = path.read_text()
          old = (
              '      setPapazKactiGame(null);\n'
              '      setPapazKactiError("");\n'
              '      setView("home");\n'
          )
          new = (
              '      setPapazKactiGame(null);\n'
              '      setPapazKactiError("");\n'
              '      setTekKartGame(null);\n'
              '      setTekKartError("");\n'
              '      setView("home");\n'
          )
          if content.count(old) != 1:
              raise RuntimeError("Expected indented exit reset anchor was not found exactly once.")
          path.write_text(content.replace(old, new, 1))
          PY

      - name: Validate generated diff
        run: git diff --check

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/JamBoxApp.tsx
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
          else
            git commit -m "feat: integrate Tek Kart into JamBox room"
            git push origin feature/tek-kart-game
          fi
