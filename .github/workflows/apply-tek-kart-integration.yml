name: Apply Tek Kart integration

on:
  push:
    branches:
      - feature/tek-kart-game
    paths:
      - automation/apply_tek_kart_app.py
      - .github/workflows/apply-tek-kart-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tek-kart-game
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply guarded integration
        run: python automation/apply_tek_kart_app.py

      - name: Validate generated diff
        run: git diff --check

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/JamBoxApp.tsx
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
          else
            git commit -m "feat: integrate Tek Kart into JamBox room"
            git push origin feature/tek-kart-game
          fi
