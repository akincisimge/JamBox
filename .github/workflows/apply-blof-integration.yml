name: Apply Blof integration

on:
  push:
    branches:
      - feature/blof-game
    paths:
      - automation/apply_blof_integration.py
      - .github/workflows/apply-blof-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/blof-game
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply integration edits
        run: python automation/apply_blof_integration.py

      - name: Validate diff
        run: git diff --check

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/JamBoxApp.tsx backend/app/api/router.py backend/app/models/__init__.py lib/jambox/client.ts types/jambox.ts
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
          else
            git commit -m "feat: integrate Blof across room frontend and API client"
            git push origin feature/blof-game
          fi

# The workflow is intentionally scoped to integration source changes only.
