name: Validate Tek Kart

on:
  pull_request:
    types: [reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feature/tek-kart-game'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jambox_tek_kart_ci
          POSTGRES_USER: jambox
          POSTGRES_PASSWORD: jambox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jambox -d jambox_tek_kart_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tek-kart-game
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Ruff
        working-directory: backend
        run: python -m ruff check .

      - name: Pytest
        working-directory: backend
        run: python -m pytest

      - name: Alembic upgrade downgrade upgrade
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://jambox:jambox@127.0.0.1:5432/jambox_tek_kart_ci
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic downgrade -1
          python -m alembic current
          python -m alembic upgrade head
          python -m alembic current

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean frontend install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Vercel build
        run: npm run build:vercel

      - name: Verified build
        run: npm run build

      - name: Commit synchronized lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized."
          else
            git commit -m "chore: synchronize frontend lock file"
            git push origin feature/tek-kart-game
          fi
